<style>
  .jobs-page { margin: 20px; }
  .status-badge { display: inline-block; padding: 1px 10px; border-radius: 12px; font-size: 0.8rem; font-weight: 500; color: #fff; white-space: nowrap; }
  .status-finished { background: #2e7d32; }
  .status-running { background: var(--primary-color, #005aa2); }
  .status-queued { background: #757575; }
  .status-failed { background: #c62828; }
  .status-running::before { content: "\25CF\00a0"; animation: jobs-pulse 1.4s ease-in-out infinite; }
  @keyframes jobs-pulse { 50% { opacity: 0.3; } }
  .jobs-summary { display: flex; flex-wrap: wrap; gap: 0.6rem; margin: 1rem 0; }
  .jobs-summary a { text-decoration: none; color: #333; border: 1px solid #ddd; border-radius: 6px; padding: 0.4rem 0.9rem; background: #fafafa; }
  .jobs-summary a.active { border-color: var(--primary-color, #005aa2); background: #e3f0fb; }
  .jobs-summary .count { font-size: 1.3rem; font-weight: 500; margin-right: 0.35rem; }
  .jobs-tabs { display: flex; gap: 1.5rem; border-bottom: 1px solid #ddd; margin-top: 1rem; }
  .jobs-tabs a { padding: 0.5rem 0; color: #666; text-decoration: none; border-bottom: 3px solid transparent; }
  .jobs-tabs a.active { color: var(--primary-color, #005aa2); border-bottom-color: var(--primary-color, #005aa2); font-weight: 500; }
  .jobs-controls { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; margin: 1rem 0; }
  .jobs-controls input[type=text], .jobs-controls select { width: auto; height: 2.2rem; margin: 0; }
  .jobs-section { margin-bottom: 1rem; }
  .jobs-section > summary { cursor: pointer; font-weight: 500; font-size: 1.05rem; padding: 0.5rem 0; }
  .jobs-section > summary .section-count { color: #888; font-weight: normal; margin-left: 0.4rem; }
  .job-label { font-weight: 500; display: block; }
  .job-id { font-size: 0.8rem; color: #666; word-break: break-all; }
  .copy-btn { border: none; background: none; cursor: pointer; color: var(--primary-color, #005aa2); font-size: 0.8rem; padding: 0 0.3rem; }
  .expires-soon { color: #c62828; font-weight: 500; }
  .muted { color: #888; }
  /* Findings on the job page */
  .job-layout { display: grid; grid-template-columns: minmax(0, 2fr) minmax(16rem, 1fr); gap: 1.5rem; align-items: start; }
  @media (max-width: 900px) { .job-layout { grid-template-columns: 1fr; } }
  .card { background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 1rem 1.25rem; margin-bottom: 1.25rem; }
  .card h6 { margin: 0 0 0.75rem; font-weight: 500; color: #555; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 0.04em; }
  .headline { font-size: 1.5rem; font-weight: 500; margin: 0; }
  .headline.status-ok, .headline.status-good { color: #2e7d32; } .headline.status-warn { color: #b26a00; } .headline.status-bad { color: #c62828; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(11rem, 1fr)); gap: 0.75rem; }
  .tile { border: 1px solid #e0e0e0; border-left: 4px solid #90a4ae; border-radius: 6px; padding: 0.6rem 0.8rem; background: #fafafa; }
  .tile.tile-ok { border-left-color: #2e7d32; } .tile.tile-warn { border-left-color: #ef9a00; } .tile.tile-bad { border-left-color: #c62828; }
  .tile .tile-value { font-size: 1.35rem; font-weight: 500; line-height: 1.2; word-break: break-word; }
  .tile .tile-label { font-size: 0.8rem; color: #666; margin-top: 0.15rem; }
  .tile .tile-note { font-size: 0.75rem; color: #888; margin-top: 0.25rem; }
  .bar-row { display: grid; grid-template-columns: minmax(6rem, 14rem) 1fr 5.5rem; gap: 0.6rem; align-items: center; margin: 0.3rem 0; font-size: 0.9rem; }
  .bar-row .bar-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-track { background: #eceff1; border-radius: 4px; height: 0.85rem; overflow: hidden; }
  .bar-fill { background: var(--primary-color, #005aa2); height: 100%; border-radius: 4px; }
  .bar-value { text-align: right; color: #555; font-variant-numeric: tabular-nums; }
  .findings-table { font-size: 0.9rem; }
  .findings-table th { font-weight: 500; color: #555; }
  .howto { color: #555; font-size: 0.9rem; margin: 0.4rem 0; }
  .howto::before { content: "\24D8\00a0"; color: var(--primary-color, #005aa2); }
  .actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-bottom: 1.25rem; }
  .alert { border-radius: 8px; padding: 0.9rem 1.2rem; margin-bottom: 1.25rem; }
  .alert-bad { background: #fdecea; border: 1px solid #f5c6c2; }
  .alert-info { background: #e3f0fb; border: 1px solid #b6d6f2; }
  .indeterminate { height: 4px; background: #cfe3f5; border-radius: 2px; overflow: hidden; margin-top: 0.75rem; }
  .indeterminate::after { content: ""; display: block; width: 30%; height: 100%; background: var(--primary-color, #005aa2); animation: jobs-slide 1.4s ease-in-out infinite; }
  @keyframes jobs-slide { from { margin-left: -30%; } to { margin-left: 100%; } }
  .facts { width: 100%; font-size: 0.9rem; } .facts td { padding: 0.3rem 0; vertical-align: top; } .facts td:first-child { color: #777; width: 42%; }
  .finding { font-size: 0.9rem; } .finding.finding-ok, .finding.finding-good { color: #2e7d32; } .finding.finding-warn { color: #b26a00; } .finding.finding-bad { color: #c62828; }
</style>
<script>
  // Copy a job's results link to the clipboard
  document.addEventListener('click', function (event) {
    var button = event.target.closest('[data-copy]');
    if (!button || !navigator.clipboard) { return; }
    navigator.clipboard.writeText(new URL(button.dataset.copy, window.location.origin).href);
    var original = button.textContent;
    button.textContent = 'copied';
    setTimeout(function () { button.textContent = original; }, 1200);
  });
</script>
