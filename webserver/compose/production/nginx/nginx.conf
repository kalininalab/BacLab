user  nginx;
worker_processes  1;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
  worker_connections  1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
  '$status $body_bytes_sent "$http_referer" '
  '"$http_user_agent" "$http_x_forwarded_for"';

  access_log  /var/log/nginx/access.log  main;

  sendfile        on;
  #tcp_nopush     on;

  keepalive_timeout  65;

  #gzip  on;

  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 10m;

  upstream app {
    server django:5000;
  }

  server {
    listen 80;
    # Lines starting with "#ssl " are switched on by start.sh when certificates are present:
    # /certs/fullchain.pem (certificate + chain) and /certs/privkey.pem
    #ssl listen 443 ssl;
    charset     utf-8;

    server_name         _;
    #ssl ssl_certificate     /certs/fullchain.pem;
    #ssl ssl_certificate_key /certs/privkey.pem;

    client_max_body_size 20G;   # genome sets / sequencing reads; the tools enforce their own limits

    location /static {
      alias /static;
    }

    location /media {
      alias /media;
    }

    location /databases/AntismashResults {
      alias /databases/AntismashResults;
    }

    location / {
      # checks for static file, if not found proxy to app
      try_files $uri @proxy_to_app;
    }

    # cookiecutter-django app
    location @proxy_to_app {
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_redirect off;
      proxy_pass   http://app;
    }
  }
}
