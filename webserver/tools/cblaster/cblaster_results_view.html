{% extends "base.html" %}
{% load citation_tags %}

{% block css %}
<style>
.sample-frame {
    width: calc(100% - 2rem);
    height: 80vh;
    margin-left: 1rem;
    margin-right: 1rem;
    border: 5px solid #212529;
}
</style>
{% endblock %}

{% block content %}

<div style="margin-bottom: 20px; padding-left: 20px; margin-left: 0; width: 100%;">
    <div style="width: 100%; display: flex">
        <div class="file-field input-field" style="width: 75%">
            <h4 style="margin:0;">Results for job: {{ job_id }}</h4>
        </div>
    </div>
</div>

<button id="downloadResults"
        class="btn"
        style="width:18%;margin-left:1rem;margin-top:15px;margin-bottom:15px;"
        onclick="downloadResults();">
  Download results
</button>

{% tool_citation job_id %}

  {% if cblaster_html_files %}
  <span style="padding-left: 10px; margin-left: 0; font-size: large;">Select view:</span>
    <select id="fileSelect"
            class="browser-default"
            style="display:inline-block;max-width:280px;"
            onchange="changeCblasterFile()">
        {% for f in cblaster_html_files %}
          <option value="{{ f }}"{% if f == current_cblaster_file %} selected{% endif %}>{{ f|cut:".html" }}</option>
        {% endfor %}
    </select>
  {% endif %}

<iframe id="cblasterFrame"
        src="{{ sample_url }}{{ sample_anchor }}"
        class="sample-frame"></iframe>

<script>
function downloadResults() {
  const jobId = "{{ job_id }}";
  if (!jobId) {
    alert("Missing job id");
    return;
  }
  const url = "{% url 'baclab:results' %}?job_id=" + encodeURIComponent(jobId) + "&download=True";
  window.location.href = url;
}

function toggleFileSelect() {
  const sel = document.getElementById('fileSelect');
  const btn = document.getElementById('toggleSelectBtn');
  if (!sel) return;
  if (sel.style.display === 'none') {
    sel.style.display = 'inline-block';
    btn.textContent = 'Hide file list';
  } else {
    sel.style.display = 'none';
    btn.textContent = 'Show file list';
  }
}

function changeCblasterFile() {
  const sel = document.getElementById('fileSelect');
  const frame = document.getElementById('cblasterFrame');
  if (!sel || !frame || !sel.value) return;
  const jobId = "{{ job_id }}";
  frame.src = "/cblaster/file/" + encodeURIComponent(jobId) + "/" + encodeURIComponent(sel.value);
}
</script>



{% endblock %}

{% block scripts %}{% endblock %}
