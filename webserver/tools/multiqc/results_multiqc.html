{% extends "results.html" %}

{% block results %}
<div class="row">
    <div class="col s12">
        <h5 class="center-align">MultiQC Summary Report</h5>
        {% if report_available %}
        <div style="width: 100%; height: 800px; border: 1px solid #ccc; border-radius: 4px; overflow: hidden; margin-top: 20px;">
            <iframe src="{% url 'baclab:multiqc_file' job_id 'multiqc_report.html' %}" style="width: 100%; height: 100%; border: none;"></iframe>
        </div>
        {% else %}
        <p>No MultiQC report was generated - no recognized log/report files were found in the uploaded archive.</p>
        {% endif %}
    </div>
</div>
{% endblock results %}
