name: server_rrefinder
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # Dependency set of the upstream RREfinder.yml, without its hard build-string pins (which also
  # hard-code the original author's prefix). Needs old python/biopython for the repo's own code.
  - python==3.7.12
  - biopython==1.76
  - blast-legacy==2.2.26
  - hhsuite==3.3.0
  - hmmer==3.3.2
  - numpy==1.21.6
  - perl==5.44.0
  - psipred==4.0
  - pip
  - git==2.56.0
